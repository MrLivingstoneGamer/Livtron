<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Livtron AI</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    radial-gradient(
      circle at 50% 20%,
      #06365b 0%,
      #021b32 35%,
      #010a15 75%,
      #00040a 100%
    );

  color: white;

  overflow: hidden;
}

/* CIRCUIT BACKGROUND */

body::before {

  content: "";

  position: fixed;

  inset: 0;

  pointer-events: none;

  opacity: .55;

  background-image:

    linear-gradient(
      90deg,
      transparent 97%,
      rgba(0,174,255,.25) 98%,
      transparent 99%
    ),

    linear-gradient(
      180deg,
      transparent 97%,
      rgba(0,174,255,.20) 98%,
      transparent 99%
    );

  background-size:
    90px 90px,
    90px 90px;

}

.circuit {

  position: fixed;

  width: 3px;

  background:
    linear-gradient(
      to bottom,
      transparent,
      #00c8ff,
      transparent
    );

  opacity: .45;

  filter:
    drop-shadow(
      0 0 8px #00bfff
    );

  animation:
    pulse 3s infinite alternate;

  pointer-events: none;
}

.c1 {
  left: 8%;
  height: 65%;
  top: -10%;
}

.c2 {
  left: 22%;
  height: 48%;
  top: 0;
  animation-delay: .8s;
}

.c3 {
  left: 48%;
  height: 70%;
  top: -15%;
  animation-delay: 1.2s;
}

.c4 {
  left: 73%;
  height: 58%;
  top: -5%;
  animation-delay: 1.8s;
}

.c5 {
  left: 91%;
  height: 72%;
  top: -20%;
  animation-delay: .5s;
}

@keyframes pulse {

  from {
    opacity: .2;
  }

  to {
    opacity: .75;
  }

}

/* APP */

.app {

  position: relative;

  z-index: 2;

  width: 100%;

  max-width: 850px;

  height: 100vh;

  margin: auto;

  display: flex;

  flex-direction: column;

  padding:
    18px
    14px
    12px;
}

/* HEADER */

.header {

  text-align: center;

  padding:
    5px
    0
    14px;
}

.logo {

  font-size: 39px;

  font-weight: 900;

  letter-spacing: 4px;

  text-shadow:
    0 0 8px #00bfff,
    0 0 25px rgba(0,191,255,.6);
}

.logo span {

  color: #00c8ff;
}

.subtitle {

  margin-top: 3px;

  font-size: 13px;

  letter-spacing: 2px;

  color: #8da9c5;
}

.status {

  display: inline-flex;

  align-items: center;

  gap: 7px;

  margin-top: 9px;

  padding:
    6px
    13px;

  border:
    1px solid
    rgba(0,205,255,.3);

  border-radius: 30px;

  background:
    rgba(0,130,190,.10);

  color: #4dffac;

  font-size: 12px;
}

.status-dot {

  width: 7px;

  height: 7px;

  border-radius: 50%;

  background: #45ff9d;

  box-shadow:
    0 0 10px #45ff9d;
}

/* CHAT */

.chat {

  flex: 1;

  min-height: 0;

  overflow-y: auto;

  padding:
    15px
    7px;

  scroll-behavior: smooth;

  scrollbar-width: thin;

  scrollbar-color:
    #087eaa
    transparent;
}

.message {

  max-width: 86%;

  padding:
    14px
    16px;

  margin:
    10px 0;

  border-radius: 18px;

  line-height: 1.55;

  white-space: pre-wrap;

  word-break: break-word;

  font-size: 15.5px;

  animation:
    messageIn .25s ease;
}

@keyframes messageIn {

  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

.bot {

  margin-right: auto;

  background:
    linear-gradient(
      135deg,
      rgba(20,52,80,.88),
      rgba(8,30,52,.88)
    );

  border:
    1px solid
    rgba(0,190,255,.18);

  border-left:
    3px solid
    #00bfff;

  box-shadow:
    0 0 18px
    rgba(0,174,255,.08);
}

.user {

  margin-left: auto;

  background:
    linear-gradient(
      135deg,
      #075d91,
      #06416e
    );

  border:
    1px solid
    rgba(0,205,255,.35);
}

/* THINKING */

.thinking {

  display: flex;

  gap: 5px;

  align-items: center;
}

.thinking span {

  width: 6px;

  height: 6px;

  border-radius: 50%;

  background: #00c8ff;

  box-shadow:
    0 0 8px #00c8ff;

  animation:
    thinking 1s infinite;
}

.thinking span:nth-child(2) {
  animation-delay: .15s;
}

.thinking span:nth-child(3) {
  animation-delay: .3s;
}

@keyframes thinking {

  0%, 60%, 100% {
    transform: translateY(0);
    opacity: .4;
  }

  30% {
    transform: translateY(-5px);
    opacity: 1;
  }

}

/* INPUT */

.input-panel {

  padding-top: 8px;
}

.input-area {

  display: flex;

  align-items: center;

  gap: 8px;

  padding: 7px;

  border:
    1px solid
    rgba(0,195,255,.25);

  border-radius: 22px;

  background:
    rgba(4,23,42,.90);

  box-shadow:
    0 0 25px
    rgba(0,174,255,.10);

  backdrop-filter:
    blur(12px);
}

#messageInput {

  flex: 1;

  min-width: 0;

  height: 50px;

  padding:
    0 12px;

  border: none;

  outline: none;

  background: transparent;

  color: white;

  font-size: 15px;
}

#messageInput::placeholder {
  color: #718ba4;
}

/* BUTTONS */

.icon-button,
#sendButton {

  border: none;

  cursor: pointer;

  flex-shrink: 0;

  transition:
    transform .15s,
    box-shadow .15s;
}

.icon-button {

  width: 45px;

  height: 45px;

  border-radius: 50%;

  background:
    rgba(0,137,201,.18);

  border:
    1px solid
    rgba(0,200,255,.3);

  color: #65dfff;

  font-size: 20px;
}

.icon-button:active,
#sendButton:active {

  transform: scale(.92);
}

#sendButton {

  height: 45px;

  padding:
    0 19px;

  border-radius: 15px;

  background:
    linear-gradient(
      135deg,
      #008ed0,
      #0065a0
    );

  color: white;

  font-weight: bold;
}

#sendButton:disabled {

  opacity: .45;

}

/* VOICE */

.voice-area {

  display: flex;

  justify-content: center;

  align-items: center;

  padding:
    12px
    0
    3px;
}

#voiceButton {

  width: 62px;

  height: 62px;

  border-radius: 50%;

  border:
    2px solid
    rgba(0,207,255,.65);

  background:
    radial-gradient(
      circle,
      #086b9d,
      #032b49
    );

  color: white;

  font-size: 25px;

  cursor: pointer;

  box-shadow:
    0 0 15px
    rgba(0,195,255,.35),
    inset 0 0 15px
    rgba(0,195,255,.18);
}

#voiceButton.listening {

  background:
    radial-gradient(
      circle,
      #00bfff,
      #00547d
    );

  box-shadow:
    0 0 20px #00c8ff,
    0 0 45px
    rgba(0,200,255,.55);

  animation:
    voicePulse 1.2s infinite;
}

@keyframes voicePulse {

  50% {
    transform: scale(1.08);
  }

}

.voice-label {

  text-align: center;

  color: #6f91ab;

  font-size: 11px;

  letter-spacing: 1.5px;

  margin-top: 3px;
}

/* TOOLBAR */

.toolbar {

  display: flex;

  justify-content: center;

  gap: 18px;

  padding-top: 8px;

  flex-wrap: wrap;
}

.tool {

  border: none;

  background: transparent;

  color: #6d8ba5;

  font-size: 12px;

  cursor: pointer;

  padding: 7px 10px;
}

.tool:hover {

  color: #00c8ff;
}

/* DELETE CONFIRMATION */

.delete-confirm {

  position: fixed;

  inset: 0;

  z-index: 20;

  display: none;

  align-items: center;

  justify-content: center;

  padding: 20px;

  background:
    rgba(0,5,15,.78);

  backdrop-filter:
    blur(8px);
}

.delete-box {

  width: 100%;

  max-width: 330px;

  padding: 25px;

  border-radius: 22px;

  text-align: center;

  background:
    linear-gradient(
      145deg,
      #0b2943,
      #061523
    );

  border:
    1px solid
    rgba(0,200,255,.35);

  box-shadow:
    0 0 35px
    rgba(0,174,255,.2);
}

.delete-box h3 {

  margin-top: 0;

  color: white;
}

.delete-box p {

  color: #8ba4ba;

  font-size: 14px;
}

.delete-buttons {

  display: flex;

  gap: 10px;

  justify-content: center;

  margin-top: 20px;
}

.delete-buttons button {

  border: none;

  padding:
    11px
    18px;

  border-radius: 12px;

  cursor: pointer;

  color: white;

  font-weight: bold;
}

#confirmDelete {

  background:
    #c73545;
}

#cancelDelete {

  background:
    #17415d;
}

/* FOOTER */

.footer {

  text-align: center;

  padding:
    7px
    0
    2px;

  color: #48647c;

  font-size: 10px;

  letter-spacing: 1px;
}

/* MOBILE */

@media (max-width: 500px) {

  .app {

    padding:
      12px
      9px
      8px;
  }

  .logo {

    font-size: 31px;

    letter-spacing: 3px;
  }

  .subtitle {
    font-size: 11px;
  }

  .chat {
    padding: 8px 3px;
  }

  .message {

    max-width: 91%;

    font-size: 15px;

    padding:
      13px
      14px;
  }

  #sendButton {

    padding:
      0 14px;
  }

}

</style>

</head>

<body>

<div class="circuit c1"></div>
<div class="circuit c2"></div>
<div class="circuit c3"></div>
<div class="circuit c4"></div>
<div class="circuit c5"></div>


<div class="app">

  <div class="header">

    <div class="logo">
      🏋️ <span>LIVTRON</span>
    </div>

    <div class="subtitle">
      YOUR AI. YOUR RULES.
    </div>

    <div class="status">

      <div class="status-dot"></div>

      LIVTRON AI ONLINE

    </div>

  </div>


  <div
    class="chat"
    id="chatBox"
  >

    <div class="message bot">

      👋 Hello! I'm Livtron AI.

      Ask me anything.

    </div>

  </div>


  <div class="voice-area">

    <button
      id="voiceButton"
      title="Speak to Livtron"
    >
      🎤
    </button>

  </div>


  <div
    class="voice-label"
    id="voiceLabel"
  >
    TAP TO SPEAK
  </div>


  <div class="input-panel">

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Ask Livtron something..."
        autocomplete="off"
      />

      <button
        class="icon-button"
        id="stopButton"
        title="Stop speaking"
      >
        🔇
      </button>

      <button
        id="sendButton"
      >
        SEND
      </button>

    </div>

  </div>


  <div class="toolbar">

    <button
      class="tool"
      id="clearButton"
    >
      🗑️ Delete Chat
    </button>

    <button
      class="tool"
      id="speakLastButton"
    >
      🔊 Speak Last
    </button>

  </div>


  <div class="footer">

    LIVTRON AI • QWEN3 • WEB • MEMORY

  </div>

</div>


<!-- DELETE CONFIRMATION -->

<div
  class="delete-confirm"
  id="deleteConfirm"
>

  <div class="delete-box">

    <h3>
      🗑️ Delete Chat?
    </h3>

    <p>
      This will clear the current conversation
      from this device.
    </p>

    <div class="delete-buttons">

      <button
        id="cancelDelete"
      >
        Cancel
      </button>

      <button
        id="confirmDelete"
      >
        Delete
      </button>

    </div>

  </div>

</div>


<script>

/* =================================
   LIVTRON CONNECTION
================================= */

const WORKER_URL =
"https://livtronai.samarpal03.workers.dev";


const input =
document.getElementById(
  "messageInput"
);

const sendButton =
document.getElementById(
  "sendButton"
);

const chatBox =
document.getElementById(
  "chatBox"
);

const voiceButton =
document.getElementById(
  "voiceButton"
);

const voiceLabel =
document.getElementById(
  "voiceLabel"
);

const stopButton =
document.getElementById(
  "stopButton"
);

const clearButton =
document.getElementById(
  "clearButton"
);

const speakLastButton =
document.getElementById(
  "speakLastButton"
);

const deleteConfirm =
document.getElementById(
  "deleteConfirm"
);

const confirmDelete =
document.getElementById(
  "confirmDelete"
);

const cancelDelete =
document.getElementById(
  "cancelDelete"
);


/* =================================
   STATE
================================= */

let lastReply = "";

let recognition = null;

let isListening = false;


/* =================================
   SAVE CHAT LOCALLY
================================= */

function saveChat() {

  try {

    localStorage.setItem(
      "livtron_chat",
      chatBox.innerHTML
    );

  } catch (error) {

    console.error(
      "Could not save chat:",
      error
    );

  }

}


/* =================================
   LOAD CHAT
================================= */

function loadChat() {

  try {

    const savedChat =
      localStorage.getItem(
        "livtron_chat"
      );

    if (savedChat) {

      chatBox.innerHTML =
        savedChat;

      chatBox.scrollTop =
        chatBox.scrollHeight;

    }

  } catch (error) {

    console.error(
      "Could not load chat:",
      error
    );

  }

}


/* =================================
   ADD MESSAGE
================================= */

function addMessage(
  text,
  type
) {

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message " + type;

  message.textContent =
    text;

  chatBox.appendChild(
    message
  );

  chatBox.scrollTop =
    chatBox.scrollHeight;

  saveChat();

  return message;
}


/* =================================
   THINKING
================================= */

function addThinking() {

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message bot";

  message.innerHTML = `
    <div class="thinking">
      <span></span>
      <span></span>
      <span></span>
      <span>Livtron is thinking...</span>
    </div>
  `;

  chatBox.appendChild(
    message
  );

  chatBox.scrollTop =
    chatBox.scrollHeight;

  return message;
}


/* =================================
   TEXT TO SPEECH
================================= */

function speak(text) {

  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }

  window.speechSynthesis.cancel();


  /*
    Pronunciation fix:

    Display:
    LIVTRON

    Voice:
    Liv Tron
  */

  const spokenText =
    text
      .replace(
        /\bLivtron\b/gi,
        "Liv Tron"
      )
      .replace(
        /\bLIVTRON\b/g,
        "Liv Tron"
      );


  const utterance =
    new SpeechSynthesisUtterance(
      spokenText
    );


  utterance.rate =
    1;

  utterance.pitch =
    1;

  utterance.volume =
    1;

  utterance.lang =
    "en-IN";


  window.speechSynthesis.speak(
    utterance
  );

}


/* =================================
   STOP SPEAKING
================================= */

function stopSpeaking() {

  if (
    "speechSynthesis" in window
  ) {

    window.speechSynthesis.cancel();

  }

}


/* =================================
   SEND MESSAGE
================================= */

async function sendMessage(
  forcedText = null
) {

  const text =
    forcedText !== null
      ? forcedText.trim()
      : input.value.trim();


  if (!text) {

    return;

  }


  addMessage(
    text,
    "user"
  );


  input.value = "";

  sendButton.disabled =
    true;

  voiceButton.disabled =
    true;


  const thinking =
    addThinking();


  try {

    const response =
      await fetch(
        WORKER_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message: text
            })

        }
      );


    const raw =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(raw);

    } catch {

      throw new Error(
        "Worker returned invalid data."
      );

    }


    thinking.remove();


    if (
      response.ok &&
      data.success
    ) {

      lastReply =
        data.reply || "";


      addMessage(
        lastReply,
        "bot"
      );


      speak(
        lastReply
      );


    } else {

      addMessage(
        "⚠️ Livtron error:\n" +
        (
          data.error ||
          "Unknown Worker error"
        ),
        "bot"
      );

    }


  }

  catch (error) {

    thinking.remove();


    addMessage(
      "❌ Connection problem:\n" +
      error.message,
      "bot"
    );


    console.error(
      "Livtron error:",
      error
    );

  }


  sendButton.disabled =
    false;

  voiceButton.disabled =
    false;

  input.focus();

}


/* =================================
   VOICE RECOGNITION
================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "en-IN";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.onstart =
    function() {

      isListening =
        true;


      voiceButton.classList.add(
        "listening"
      );


      voiceLabel.textContent =
        "LISTENING...";

    };


  recognition.onresult =
    function(event) {

      const transcript =
        event
          .results[0][0]
          .transcript;


      input.value =
        transcript;


      voiceLabel.textContent =
        "PROCESSING...";


      sendMessage(
        transcript
      );

    };


  recognition.onerror =
    function(event) {

      console.error(
        "Voice error:",
        event.error
      );


      voiceLabel.textContent =
        "VOICE ERROR";

    };


  recognition.onend =
    function() {

      isListening =
        false;


      voiceButton.classList.remove(
        "listening"
      );


      voiceLabel.textContent =
        "TAP TO SPEAK";

    };

}


/* =================================
   VOICE BUTTON
================================= */

voiceButton.addEventListener(
  "click",
  function() {

    if (!recognition) {

      addMessage(
        "🎤 Voice input isn't supported by this browser. Try Chrome.",
        "bot"
      );

      return;

    }


    if (isListening) {

      recognition.stop();

      return;

    }


    try {

      recognition.start();

    }

    catch (error) {

      console.error(
        error
      );

    }

  }
);


/* =================================
   SEND
================================= */

sendButton.addEventListener(
  "click",
  function() {

    sendMessage();

  }
);


/* =================================
   ENTER
================================= */

input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =================================
   STOP VOICE
================================= */

stopButton.addEventListener(
  "click",
  function() {

    stopSpeaking();

  }
);


/* =================================
   SPEAK LAST
================================= */

speakLastButton.addEventListener(
  "click",
  function() {

    if (lastReply) {

      speak(
        lastReply
      );

    }

  }
);


/* =================================
   OPEN DELETE CONFIRMATION
================================= */

clearButton.addEventListener(
  "click",
  function() {

    deleteConfirm.style.display =
      "flex";

  }
);


/* =================================
   CANCEL DELETE
================================= */

cancelDelete.addEventListener(
  "click",
  function() {

    deleteConfirm.style.display =
      "none";

  }
);


/* =================================
   DELETE CHAT
================================= */

confirmDelete.addEventListener(
  "click",
  function() {

    stopSpeaking();

    localStorage.removeItem(
      "livtron_chat"
    );


    chatBox.innerHTML = `
      <div class="message bot">
        👋 Hello! I'm Livtron AI.

        Ask me anything.
      </div>
    `;


    lastReply = "";


    deleteConfirm.style.display =
      "none";


    saveChat();

  }
);


/* =================================
   LOAD SAVED CHAT
================================= */

loadChat();

</script>

</body>

   </html>
