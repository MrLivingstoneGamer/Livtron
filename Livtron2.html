<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livtron AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #0b1224;
  color: white;
}

.header {
  text-align: center;
  padding: 45px 20px 25px;
}

.logo {
  font-size: 42px;
  font-weight: bold;
}

.subtitle {
  color: #9aa8c2;
  font-size: 18px;
  margin-top: 8px;
}

.status {
  margin-top: 18px;
  color: #58e59a;
  font-weight: bold;
}

.app {
  width: 94%;
  max-width: 700px;
  margin: auto;
  background: #19263c;
  border-radius: 25px;
  padding: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,.3);
}

.chat {
  height: 55vh;
  min-height: 400px;
  max-height: 600px;
  overflow-y: auto;
  background: #0d1629;
  border-radius: 20px;
  padding: 18px;
}

.message {
  max-width: 85%;
  padding: 15px 17px;
  margin: 12px 0;
  border-radius: 18px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-wrap: break-word;
}

.bot {
  background: #263650;
  margin-right: auto;
}

.user {
  background: #376db1;
  margin-left: auto;
}

.input-area {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

#messageInput {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  border-radius: 16px;
  padding: 16px;
  font-size: 16px;
}

#sendButton {
  border: none;
  border-radius: 16px;
  padding: 0 24px;
  background: #4b8df8;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

#sendButton:disabled {
  opacity: .5;
}

.footer {
  text-align: center;
  padding: 25px;
  color: #73819a;
}

@media (max-width: 500px) {
  .logo {
    font-size: 34px;
  }

  .app {
    width: 96%;
    padding: 12px;
  }

  .chat {
    min-height: 430px;
  }

  .input-area {
    gap: 6px;
  }

  #sendButton {
    padding: 0 16px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">🏋 LIVTRON</div>
  <div class="subtitle">Your AI. Your Rules.</div>
  <div class="status">● Livtron AI Online</div>
</div>

<div class="app">

  <div class="chat" id="chatBox">

    <div class="message bot">
      👋 Hello! I'm <b>Livtron AI</b>.

      Ask me anything.
    </div>

  </div>

  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Ask Livtron something..."
      autocomplete="off"
    >

    <button id="sendButton">
      Send
    </button>

  </div>

</div>

<div class="footer">
  Powered by Livtron AI
</div>


<script>

const WORKER_URL =
  "https://livtronai.samarpal03.workers.dev";

const input =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const chatBox =
  document.getElementById("chatBox");


function addMessage(text, type) {

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  message.textContent = text;

  chatBox.appendChild(message);

  chatBox.scrollTop =
    chatBox.scrollHeight;

  return message;
}


async function sendMessage() {

  const text =
    input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  sendButton.disabled = true;

  const thinking =
    addMessage("Thinking... 🤖", "bot");


  try {

    const response =
      await fetch(WORKER_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: text
        })

      });


    const data =
      await response.json();


    thinking.remove();


    if (data.success === true) {

      addMessage(
        data.reply || "I didn't receive a response.",
        "bot"
      );

    } else {

      addMessage(
        "⚠️ Livtron error: " +
        (data.error || "Unknown error"),
        "bot"
      );

    }


  } catch (error) {

    thinking.remove();

    addMessage(
      "❌ Connection error. Please try again.",
      "bot"
    );

    console.error(error);

  }


  sendButton.disabled = false;

  input.focus();
}


sendButton.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {
      sendMessage();
    }

  }
);

</script>

</body>
</html>
