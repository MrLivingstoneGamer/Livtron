<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Livtron AI</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  font-family:
    Arial,
    sans-serif;

  background:
    #0b1224;

  color: white;
}

.header {

  text-align: center;

  padding:
    38px
    15px
    22px;
}

.logo {

  font-size: 42px;

  font-weight: bold;

  letter-spacing: 1px;
}

.subtitle {

  margin-top: 8px;

  font-size: 18px;

  color: #9aa8c2;
}

.status {

  margin-top: 16px;

  color: #55e89a;

  font-weight: bold;
}

.app {

  width: 94%;

  max-width: 700px;

  margin: auto;

  background:
    #19263c;

  border-radius: 25px;

  padding: 18px;

  box-shadow:
    0 15px 45px
    rgba(0,0,0,.35);
}

.chat {

  height: 55vh;

  min-height: 400px;

  max-height: 620px;

  overflow-y: auto;

  background:
    #0d1629;

  border-radius: 20px;

  padding: 18px;
}

.message {

  max-width: 86%;

  padding:
    14px
    17px;

  margin:
    12px
    0;

  border-radius: 18px;

  line-height: 1.55;

  white-space: pre-wrap;

  word-wrap: break-word;

  font-size: 16px;
}

.bot {

  background:
    #263650;

  margin-right: auto;
}

.user {

  background:
    #376db1;

  margin-left: auto;
}

.input-area {

  display: flex;

  gap: 9px;

  margin-top: 14px;
}

#messageInput {

  flex: 1;

  min-width: 0;

  padding: 16px;

  border: none;

  outline: none;

  border-radius: 16px;

  font-size: 16px;
}

#sendButton {

  border: none;

  border-radius: 16px;

  padding:
    0
    23px;

  background:
    #4b8df8;

  color: white;

  font-size: 16px;

  font-weight: bold;
}

#sendButton:disabled {

  opacity: .55;
}

.footer {

  text-align: center;

  padding: 22px;

  color: #71809a;
}

@media (max-width: 500px) {

  .logo {

    font-size: 34px;
  }

  .app {

    width: 96%;

    padding: 12px;
  }

  .chat {

    min-height: 430px;
  }

  #sendButton {

    padding:
      0
      16px;
  }

}

</style>

</head>


<body>


<div class="header">

  <div class="logo">
    🏋️ LIVTRON
  </div>

  <div class="subtitle">
    Your AI. Your Rules.
  </div>

  <div class="status">
    ● Livtron AI Online
  </div>

</div>


<div class="app">


<div class="chat" id="chatBox">


<div class="message bot">
👋 Hello! I'm Livtron AI.

Ask me anything.
</div>


</div>


<div class="input-area">


<input
id="messageInput"
type="text"
placeholder="Ask Livtron something..."
autocomplete="off"
/>


<button
id="sendButton">
Send
</button>


</div>


</div>


<div class="footer">

Powered by Livtron AI

</div>


<script>


const WORKER_URL =
"https://livtronai.samarpal03.workers.dev";


const input =
document.getElementById(
"messageInput"
);


const sendButton =
document.getElementById(
"sendButton"
);


const chatBox =
document.getElementById(
"chatBox"
);


function addMessage(
  text,
  type
) {

  const message =
  document.createElement(
    "div"
  );

  message.className =
    "message " + type;

  message.textContent =
    text;

  chatBox.appendChild(
    message
  );

  chatBox.scrollTop =
    chatBox.scrollHeight;

  return message;
}


async function sendMessage() {


  const text =
    input.value.trim();


  if (!text) {

    return;

  }


  addMessage(
    text,
    "user"
  );


  input.value = "";


  sendButton.disabled =
    true;


  const thinking =
    addMessage(
      "Thinking... 🧠",
      "bot"
    );


  try {


    const response =
      await fetch(
        WORKER_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message: text
            })

        }
      );


    const raw =
      await response.text();


    let data;


    try {

      data =
        JSON.parse(raw);

    } catch {

      throw new Error(
        "Worker returned invalid data: "
        + raw.substring(0,200)
      );

    }


    thinking.remove();


    if (
      response.ok &&
      data.success
    ) {

      addMessage(
        data.reply,
        "bot"
      );

    } else {

      addMessage(
        "⚠️ Livtron error:\n"
        + (
          data.error ||
          "Unknown Worker error"
        ),
        "bot"
      );

    }


  } catch (error) {


    thinking.remove();


    addMessage(
      "❌ Connection problem:\n"
      + error.message,
      "bot"
    );


    console.error(
      "Livtron error:",
      error
    );

  }


  sendButton.disabled =
    false;


  input.focus();

}


sendButton.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      sendMessage();

    }

  }
);


</script>


</body>

</html>
