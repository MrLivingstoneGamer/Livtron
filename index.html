<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Livtron AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      padding: 45px 15px 25px;
    }

    .logo {
      font-size: 55px;
      margin-bottom: 5px;
    }

    .title {
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .tagline {
      color: #9ca9c0;
      font-size: 17px;
      margin-top: 10px;
    }

    .chat-container {
      width: 92%;
      max-width: 700px;
      margin: 20px auto;
      background: #182337;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    .status {
      text-align: center;
      color: #65e6a5;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .chat-box {
      height: 430px;
      overflow-y: auto;
      background: #0f1728;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .message {
      margin: 12px 0;
      padding: 13px 15px;
      border-radius: 15px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .bot {
      background: #24324a;
      margin-right: 25px;
    }

    .user {
      background: #315c9c;
      margin-left: 25px;
      text-align: right;
    }

    .input-area {
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 13px;
      outline: none;
      font-size: 16px;
      background: white;
      color: #111;
    }

    #sendButton {
      border: none;
      border-radius: 13px;
      padding: 0 22px;
      background: #4f8cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;
      color: #6f7d94;
      font-size: 13px;
      padding: 20px;
    }

    @media (max-width: 500px) {
      .title {
        font-size: 32px;
      }

      .logo {
        font-size: 45px;
      }

      .chat-box {
        height: 400px;
      }

      #sendButton {
        padding: 0 16px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">🤖</div>

    <div class="title">
      LIVTRON
    </div>

    <div class="tagline">
      Your AI. Your Rules.
    </div>
  </div>


  <div class="chat-container">

    <div class="status">
      ● Livtron AI Online
    </div>


    <div class="chat-box" id="chatBox">

      <div class="message bot">
        👋 Hello! I'm <b>Livtron AI</b>.<br>
        Ask me anything.
      </div>

    </div>


    <div class="input-area">

      <input
        type="text"
        id="messageInput"
        placeholder="Ask Livtron something..."
        autocomplete="off"
      >

      <button id="sendButton">
        Send
      </button>

    </div>

  </div>


  <div class="footer">
    Powered by Livtron AI
  </div>


  <script>

    const WORKER_URL =
      "https://livtronai.samarpal03.workers.dev";


    const input =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const chatBox =
      document.getElementById("chatBox");


    function addMessage(text, type) {

      const message =
        document.createElement("div");

      message.className =
        "message " + type;

      message.textContent = text;

      chatBox.appendChild(message);

      chatBox.scrollTop =
        chatBox.scrollHeight;

      return message;
    }


    async function sendMessage() {

      const message =
        input.value.trim();

      if (!message) {
        return;
      }


      addMessage(message, "user");


      input.value = "";


      sendButton.disabled = true;

      sendButton.textContent =
        "Thinking...";


      const loading =
        addMessage(
          "🤔 Livtron is thinking...",
          "bot"
        );


      try {

        const response =
          await fetch(WORKER_URL, {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message: message
            })

          });


        const data =
          await response.json();


        loading.remove();


        if (data.success) {

          addMessage(
            data.reply ||
            "I couldn't generate a response.",
            "bot"
          );

        } else {

          addMessage(
            "❌ Error: " +
            (data.error ||
            "Something went wrong."),
            "bot"
          );

        }


      } catch (error) {

        loading.remove();

        addMessage(
          "❌ Unable to connect to Livtron AI. Please try again.",
          "bot"
        );

        console.error(error);

      }


      sendButton.disabled = false;

      sendButton.textContent =
        "Send";

      input.focus();

    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          sendMessage();

        }

      }
    );

  </script>

</body>
</html>
