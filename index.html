<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livtron AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 5px;
    }

    p {
      color: #94a3b8;
    }

    .chat {
      background: #1e293b;
      border-radius: 15px;
      padding: 20px;
      margin-top: 25px;
    }

    input {
      width: 70%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-top: 15px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-left: 5px;
    }

    #response {
      margin-top: 20px;
      color: #cbd5e1;
      min-height: 30px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🤖 LIVTRON</h1>

    <p>Your AI. Your Rules.</p>

    <div class="chat">

      <div id="response">
        Hello! I'm Livtron. 👋
      </div>

      <input
        id="message"
        type="text"
        placeholder="Ask Livtron something..."
      >

      <button onclick="talkToLivtron()">
        Send
      </button>

    </div>

  </div>

  <script>

    function talkToLivtron() {

      const message =
        document.getElementById("message").value;

      const response =
        document.getElementById("response");

      if (message.trim() === "") {
        response.innerText =
          "Please type something first. 😄";
        return;
      }

      response.innerText =
        "Livtron received: " + message;

    }

  </script>

</body>
        </html>
